name: Public release checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Check public-release boundaries
        run: bash scripts/check_public_release.sh
      - name: Compile Python sources
        run: python -m compileall -q llava tests
      - name: Check entry-point contracts
        run: python -m unittest discover -s tests -v
      - name: Parse shell entry points
        run: for script in scripts/*.sh; do bash -n "$script"; done

  baseline-cpu:
    runs-on: ubuntu-latest
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install pinned CPU runtime
        run: |
          python -m pip install torch==2.1.2 torchvision==0.16.2 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Check selectors, masks and cached decoding
        run: python -m unittest discover -s tests -v
